latte2026interactive:
  title: "Interactive Compiler Scheduling with Strong Guarantees"
  abstract: "<p>
    This work explores interactive synthesis of compiler schedules for hardware
    accelerators. Using Programming by Navigation and the FuseFlow sparse machine
    learning compiler, the prototype guides users through valid scheduling choices
    while preserving access to every valid schedule supported by its library.
    The approach combines programmer control with guarantees that intermediate
    choices can lead to a valid schedule.
    </p>"
  pdf: https://capra.cs.cornell.edu/latte26/paper/latte26-final6.pdf
  authors:
    - williams-evan
    - lubin-justin
    - lacouture
    - hsu
  appearances:
    - venue: Workshop on Languages, Tools, and Techniques for Accelerator Design (LATTE) co-located with ASPLOS
      year: 2026
      month: March
    - title: "Interactive Design Space Exploration for Sparse Accelerators"
      venue: Young Architect Workshop (YArch) co-located with ISCA
      year: 2026
      month: June

latte2026tiling:
  title: "Portable Dynamic Tiling for Sparse Tensor Accelerators"
  abstract: "<p>
    LEGO is a compiler for generating dynamic tiling algorithms for sparse tensor
    accelerators. Users describe policies that adjust tile boundaries in response
    to sparse structural properties, separating those policies from tensor
    expressions, storage formats, and accelerator-specific dispatch code. This
    separation makes policies reusable across workloads and backends. In an
    ExTensor simulation, tiles from a generated Dynamic Reflexive Tiling-style
    algorithm achieve runtimes within 1% of the handwritten baseline.
    </p>"
  pdf: https://capra.cs.cornell.edu/latte26/paper/latte26-final23.pdf
  authors:
    - ravipatigautham
    - kjolstad
    - raina
    - hsu
  appearances:
    - venue: Workshop on Languages, Tools, and Techniques for Accelerator Design (LATTE) co-located with ASPLOS
      year: 2026
      month: March
    - title: "Portable Dynamic Tiling for Sparse Tensor Applications"
      venue: Young Architect Workshop (YArch) co-located with ISCA
      year: 2026
      month: June

